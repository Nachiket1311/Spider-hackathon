<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=public/index.html">
    <title>BMW Experience Portal - Spider Hackathon</title>
    <link rel="icon" href="public/logo.png" type="image/png">
    <script>
        window.location.replace("public/index.html");
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1115;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 70px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        p {
            color: #a0aec0;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: #0066b1;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #0080dc;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="public/logo.png" alt="BMW Logo" class="logo">
        <h1>BMW Experience Portal</h1>
        <p>Redirecting to the Spider Hackathon BMW Showcase...</p>
        <a href="public/index.html" class="btn">Enter Experience</a>
    </div>
</body>
</html>
